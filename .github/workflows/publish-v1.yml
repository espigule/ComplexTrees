name: Retire superseded draft distribution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retain the old release privately as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.0 --draft=true --title 'Earlier draft — pending author review' --notes-file RELEASE_NOTES.md
          test "$(gh release view v1.0.0 --json isDraft --jq .isDraft)" = true
