name: Verify retained scientific records and publication policy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify the scientific and publication manifests
        run: sha256sum --check --quiet MANIFEST.sha256
      - name: Replay independent exact-record checks
        run: python3 tools/check_release.py
      - name: Check approved public assets and withheld manuscripts
        run: python3 tools/check_publication.py
